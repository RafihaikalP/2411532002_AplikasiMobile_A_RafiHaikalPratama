# Build APK otomatis di GitHub (tanpa perlu install Flutter di laptop).
# Push project ini ke repo GitHub -> tab Actions -> Build APK -> unduh artifact "app-release-apk".
name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate folder android
        run: flutter create --project-name expense_tracker --org com.example --platforms=android .
      - name: Hapus test bawaan
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
